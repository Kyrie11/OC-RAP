[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metadrive-recovery-recap"
version = "0.1.0"
description = "ReCAP: CARE + MERO recoverability-centered planning over MetaDrive/CARLA BEV roots"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ocrap*", "recap*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
