[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrap"
version = "0.2.0"
description = "Observation-Consistent Recovery-Affordance Planner implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
womd = [
  "protobuf>=4.25",
  "crc32c>=2.3"
]
waymax = ["waymax>=0.1.0", "jax>=0.4.0", "jaxlib>=0.4.0"]
dev = ["pytest>=8.0", "ruff", "mypy"]

[project.scripts]
ocrap = "ocrap.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
