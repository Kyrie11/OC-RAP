seed: 7
data_source: synthetic_artifact
num_synthetic_scenarios: 4
womd_patterns: null
max_scenarios: null
sample_rate_hz: 10
history_horizon_s: 1.0
prefix_horizon_s: 1.0
recovery_horizon_s: 4.0
planning_time_stride_s: 0.5
max_times_per_scenario: 2
max_biased_times_per_scenario: 2
max_agents: 32
max_map_polylines: 128
max_polyline_points: 64
max_dynamic_signals: 16
route_points: 80
max_route_projection_distance_m: 8.0
min_route_length_m: 10.0
local_radius_m: 80.0
bev_resolution_m: 2.0
bev_channels: 7
num_candidate_prefixes: 24
num_reactive_futures: 4
num_targeted_futures: 8
num_roots: 8
num_recovery_options: 24
prefix_param_dim: 5
margin_clip: 5.0
root_margin_aggregation: lcvar
intra_root_lcvar_alpha: 0.2
hidden_emergence_delay_steps: 2
min_unknown_ratio_for_hidden: 0.01
eps_signature: 0.3
epsilon_obs: 1.0
tau_obs: 1.4426950408889634
wheelbase_m: 2.8
speed_limit_default: 13.4
route_width: 3.5
route_dev_max_m: 2.5
default_available_distance_m: 60.0
d_safe0_m: 1.0
safe_time_headway_s: 0.5
comfort_brake_mps2: -3.0
control_delay_s_default: 0.2
delta_v_max_mps: 5.0
yaw_rate_max_rps: 0.6
simulation_backend: ocrap_surrogate
# The current open-source path parses WOMD and generates replay/reactive/targeted
# counterfactuals internally. A true Waymax rollout backend must set
# future_metadata[*].waymax_runtime=true before making Waymax closed-loop claims.
future_priors:
  replay: 0.25
  reactive: 0.35
  targeted: 0.4
control_limits:
  a_max: 3.0
  a_min: -6.0
  j_max: 6.0
  delta_max: 0.55
  steer_rate_max: 0.5
  v_max: 20.0
margin_scales:
  distance: 2.0
  stop: 5.0
  accel: 1.0
  decel: 1.0
  steer: 0.1
  jerk: 2.0
  steer_rate: 0.1
  route: 1.0
  delta_v: 2.0
  yaw: 0.2
  inactive: 10.0
obs_distance:
  s_c: 2.0
  s_v: 2.0
  s_p: 2.0
  s_yaw: 0.2
  lambda_psi: 0.5
  lambda_v: 0.5
  lambda_type: 2.0
  lambda_occ: 1.0
  lambda_ego: 0.5
  lambda_map: 0.5
  p_unmatch: 5.0
utility_weights:
  progress: 1.0
  comfort: 0.05
  route: 0.5
  logdiv: 0.05
  offroad: 5.0
  wrongway: 5.0
split_ratios:
  train: 0.7
  val: 0.1
  calibration: 0.1
  test: 0.1
regime_thresholds:
  tau_high: 1.0
  tau_d: 2.0
  tau_ttc: 3.0
  tau_occ: 0.05
ocmero:
  alpha: 0.2
  beta: 0.2
  top_m: 8
artifact:
  gamma_orc: 0.0
  gamma_dep: 0.0
  delta_neg: 0.0
  min_fraction_train_warning: 0.05
  force_mine: true
  # Keep true for synthetic artifact fixtures. For primary WOMD labels, set to false
  # to avoid hand-coded artifact-branch margins and rely on teacher rollouts.
  use_margin_override: true
  # Strong negative margin for the deliberately mined incompatible branch.  The
  # hidden yield/accelerate roots each have small prior mass; if this is only
  # mildly negative, lower-tail deployable recovery can stay positive and the
  # generated stress set will contain ODG but no FRA/anti-oracle samples.
  compatible_margin: 1.2
  incompatible_margin: -6.0
selection:
  gamma_rec: 0.0
  fixed_gamma_rec: 0.0
  gamma_H: 0.0
  gamma_D: 5.0
calibration:
  deltas:
  - 0.01
  - 0.05
  - 0.1
  numerical_margin: 0.0
  strict: true
  required_min_for_delta: 100
model:
  d_model: 128
  d_z: 128
  d_obs: 64
  d_signature: 32
  d_future_signature: 32
  num_macros: 16
  no_occlusion_bev: false
dataset_quality:
  # Off by default for broad natural-WOMD sweeps. Enable for artifact/stress
  # dataset builds that are intended to support FRA, ODG, and anti-oracle claims.
  require_artifact_pairs: false
  # 0 means keep every accepted prefix. For artifact sanity/debug builds, a small
  # value such as 4-8 avoids spending a full scene-time on redundant prefixes once
  # enough artifact-bearing examples have been accepted.
  max_accepted_prefixes_per_scene_time: 0
training:
  device: auto
  batch_size: 16
  num_workers: 0
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0
  artifact_sampler_weight: 0.25
  root_target_mode: recovery_signature
loss_weights:
  assign: 1.0
  sig: 0.5
  ib: 0.01
  obs: 1.0
  margin: 2.0
  anti_oracle: 1.0
  utility: 0.2
evaluation:
  batch_size: 64
  delta: 0.05
  methods:
  - nominal
  - risk_aware
  - backup_filter
  - contingency
  - oracle_filter
  - ocrap
baselines:
  risk_lambda: 1.0
metrics:
  sigma_u: 1.0
progress: true
# Dataset-source sharding for multi-process builds, e.g. two GPUs with
# CUDA_VISIBLE_DEVICES=0/1 and scenario_stride=2, scenario_worker_index=0/1.
scenario_start_index: 0
scenario_stride: 1
scenario_worker_index: 0
waymax:
  # auto = structural teacher for artifact override sanity/stress builds, hybrid
  # otherwise. Use waymax for a strict runtime-only teacher, or structural for
  # fast label generation from the recovery-affordance teacher.
  teacher_backend: auto
  # 1 records metrics at every recovery step, preserving previous hybrid/strict
  # semantics. Use 0 for final-step-only metric checks when debugging speed.
  teacher_metrics_stride: 1
ablation:
  without_observation_kernel: false
  without_lower_tail: false
  without_calibration: false
  without_anti_oracle: false
  full_future_roots: false
  no_occlusion_bev: false
