external_baselines:
  baseline: gameformer_lite
  methods: [gameformer_lite]
  max_candidates: 24
  hard_weight: 12.0
  harm_weight: 2.0
  oracle_weight: 1.0
  model:
    max_candidates: 24
    d_model: 256
    num_layers: 3
    num_heads: 4
    dropout: 0.15
  training:
    device: auto
    batch_size: 48
    num_workers: 4
    epochs: 24
    lr: 0.00015
    weight_decay: 0.0002
    grad_clip: 5.0
  loss_weights:
    policy: 1.0
    utility: 0.10
    hard: 0.50
    harm: 0.25
    oracle_rec: 0.75
    deploy_rec: 0.10
  policy:
    gamma_H: 0.0
    gamma_D: 5.0
    gamma_oracle_rec: 0.0
    gameformer_hard_weight: 12.0
    gameformer_harm_weight: 2.0
    gameformer_oracle_weight: 1.0
