external_baselines:
  baseline: plan_r1
  methods: [plan_r1]
  max_candidates: 24
  supervision_target: logged_nominal
  allow_teacher_supervision: false
  implementation: plan_r1_womd_token_vdgrpo_port_v60
  model:
    arch: plan_r1
    implementation: plan_r1_womd_token_vdgrpo_port_v60
    max_candidates: 24
    d_model: 128
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    scene_layers: 2
    future_len: 20
    history_len: 11
    source_max_agents: 16
    source_map_polygons: 64
    source_map_points: 20
    source_centerline_points: 120
    token_interval: 5
    num_tokens: 1024
    token_codebook: assets/external_baselines/planr1_tokens_1024.pt
  plan_r1:
    beta: 0.1
    scaling_factor: 0.1
    token_ce_weight: 1.0
    utility_weight: 1.0
    hard_weight: 8.0
    harm_weight: 2.0
    feasible_bonus: 0.5
  training:
    device: auto
    distributed: false
    batch_size: 12
    num_workers: 4
    epochs: 28
    lr: 0.0003
    weight_decay: 0.0001
    scheduler: warmup_cosine
    warmup_epochs: 4
    min_lr: 0.00001
    amp: true
    amp_dtype: auto
    fused_optimizer: true
    grad_clip: 5.0
    tqdm: true
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  loss_weights:
    policy: 0.20
    planr1_native: 1.0
    diffusion_native: 0.0
    flow_native: 0.0
    levelk: 0.0
    level_response: 0.0
    topology: 0.0
    wayformer_native: 0.0
    gameformer_traj: 0.0
    plantf_native: 0.0
    pluto_native: 0.0
    pluto_contrastive: 0.0
    utility: 0.0
    hard: 0.0
    harm: 0.0
    oracle_rec: 0.0
    deploy_rec: 0.0
