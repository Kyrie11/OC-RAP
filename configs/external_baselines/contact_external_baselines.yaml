external_baselines:
  baseline: postimpact_mpc_lite
  methods:
    - postimpact_mpc_lite
    - post_crash_braking
    - post_collision_restoration
    - severity_minimization
  max_candidates: 24
  policy:
    # Shared contact-regime numerical assumptions.  These match the uploaded
    # post-impact papers' passenger-car scale and keep the finite-lattice
    # adapters independent of any hidden test labels.
    contact_dt: 0.1
    contact_mu: 0.75
    vehicle_mass: 1750.0
    vehicle_iz: 2350.0

    # Wang et al. Integrated Post-Impact Planning and Active Safety Control.
    # Finite-lattice MPC adapter: stability + obstacle constraints + SBD mode
    # decision + adhesion proxy + shared post-contact recovery option.
    postimpact_gamma: 0.0
    postimpact_dt: 0.1
    postimpact_mu: 0.75
    postimpact_sbd_margin: 4.0
    postimpact_sbd_wrong_mode_penalty: 1.5
    postimpact_sbd_terminal_speed_weight: 0.35
    postimpact_lane_change_lateral_weight: 0.08
    postimpact_yaw_rate_weight: 1.4
    postimpact_yaw_acc_weight: 0.15
    postimpact_terminal_speed_weight: 0.25
    postimpact_accel_weight: 0.08
    postimpact_steer_weight: 0.08
    postimpact_jerk_weight: 0.02
    postimpact_adhesion_weight: 1.1
    postimpact_hard_weight: 8.0
    postimpact_harm_weight: 2.5
    postimpact_rejoin_weight: 0.20
    postimpact_shared_drs_weight: 3.0
    postimpact_yaw_rate_gate: 2.2
    postimpact_adhesion_gate: 1.25
    postimpact_hard_gate: 0.0

    # Post-crash braking / stable-stop rule, based on post-crash braking systems
    # that trigger after a crash/contact and slow the vehicle to a controlled stop
    # to prevent secondary collisions.
    stable_stop_gamma: 0.0
    stable_stop_terminal_speed_weight: 1.8
    stable_stop_yaw_rate_weight: 2.0
    stable_stop_yaw_acc_weight: 0.20
    stable_stop_hard_weight: 12.0
    stable_stop_harm_weight: 4.0
    stable_stop_steer_weight: 0.20
    stable_stop_jerk_weight: 0.04
    stable_stop_non_stop_macro_penalty: 2.0
    stable_stop_utility_tiebreak: 0.03
    stable_stop_terminal_speed_gate: 2.0
    stable_stop_yaw_rate_gate: 1.4
    stable_stop_hard_gate: 0.0

    # Ghosh et al. post-collision trajectory restoration heuristic: two-stage
    # sinusoidal steering and tractive-force shaping without full braking.
    restoration_gamma: 0.0
    restoration_tau0: 0.1
    restoration_tau1: 0.45
    restoration_tau2: 0.65
    restoration_tau3: 0.95
    restoration_tauc1: 0.35
    restoration_tauc2: 0.85
    restoration_A1: 0.175
    restoration_A2: -0.10
    restoration_accel_pulse: 0.9
    restoration_kdir: 1.0
    restoration_shape_weight: 0.8
    restoration_yaw_rate_weight: 1.1
    restoration_lateral_weight: 0.25
    restoration_hard_weight: 9.0
    restoration_harm_weight: 2.0
    restoration_speed_preservation_weight: 2.0
    restoration_min_speed_fraction: 0.45
    restoration_admit_min_speed_fraction: 0.30
    restoration_adhesion_weight: 0.75
    restoration_utility_weight: 0.25
    restoration_yaw_rate_gate: 2.2
    restoration_hard_gate: 0.0

    # Severity-minimization / unavoidable-collision planner: choose the lowest
    # crash-severity and post-impact instability candidate rather than imposing a
    # zero-contact filter when contact is unavoidable.
    severity_gamma: 0.0
    severity_harm_weight: 10.0
    severity_hard_weight: 5.0
    severity_delta_v_weight: 2.0
    severity_residual_energy_weight: 0.8
    severity_instability_weight: 1.2
    severity_odg_weight: 0.6
    severity_deployability_weight: 1.5
    severity_rdep_weight: 0.25
    severity_utility_tiebreak: 0.05
    severity_contact_macro_bonus: 0.20
    # Omit severity_admit_threshold by default: the selector uses the current
    # candidate-set 60th percentile, avoiding test-label fitting.

closed_loop:
  num_candidate_prefixes: 24
  replan_interval_steps: 1
  label_mode: all
  force_teacher_baselines: true
  artifact_mine_probability: 0.0

waymax:
  compute_future_metrics: true
  dataloader_include_sdc_paths: false
  metrics_to_run: [log_divergence, overlap, offroad, kinematic_infeasibility]
