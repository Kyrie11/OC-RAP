external_baselines:
  baseline: flow_planner
  methods: [flow_planner]
  max_candidates: 24
  supervision_target: logged_nominal
  allow_teacher_supervision: false
  implementation: flow_planner_womd_lattice_port_v60
  model:
    arch: flow_planner
    implementation: flow_planner_womd_lattice_port_v60
    max_candidates: 24
    d_model: 160
    num_layers: 3
    num_heads: 5
    dropout: 0.10
    scene_layers: 2
    future_len: 20
    history_len: 11
    source_max_agents: 16
    source_map_polygons: 64
    source_map_points: 20
    source_centerline_points: 120
    token_size: 5
    token_stride: 3
    # Match the released Flow Planner defaults (cfg_prob=0.3, cfg_weight=1.8).
    cfg_dropout: 0.30
    cfg_weight: 1.8
    consistency_weight: 0.5
    energy_weight: 1.5
  training:
    device: auto
    distributed: false
    batch_size: 20
    num_workers: 4
    epochs: 24
    lr: 0.0002
    weight_decay: 0.0001
    scheduler: warmup_cosine
    warmup_epochs: 2
    min_lr: 0.00001
    amp: true
    amp_dtype: auto
    fused_optimizer: true
    grad_clip: 5.0
    tqdm: true
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  loss_weights:
    policy: 0.25
    flow_native: 1.0
    diffusion_native: 0.0
    planr1_native: 0.0
    levelk: 0.0
    level_response: 0.0
    topology: 0.0
    wayformer_native: 0.0
    gameformer_traj: 0.0
    plantf_native: 0.0
    pluto_native: 0.0
    pluto_contrastive: 0.0
    utility: 0.0
    hard: 0.0
    harm: 0.0
    oracle_rec: 0.0
    deploy_rec: 0.0
