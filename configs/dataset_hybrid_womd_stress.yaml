implementation_level: final
backend: metadrive_scenarionet_hybrid_stress
schema:
  source: WOMD/ScenarioNet roots with deterministic stress perturbations
  model_inputs: [bev, ego_info, route_command]
  forbid_model_inputs: [actor_log_table, future_trajectories, recorder_packets, stress_type]
planner:
  K_raw: 64
  K: 32
  L: 12
  M: 8
  H_p: 10
  H_r: 25
  dt: 0.2
model:
  name: recot
  hidden: 128
  g_dim: 9
  use_monotone_calibrator: true
  use_observation_consistency: true
loss:
  lambda_g: 1.0
  lambda_y: 1.0
  lambda_h: 0.5
  lambda_k: 0.5
  lambda_u: 0.2
  lambda_c: 1.0
  lambda_beta: 0.5
  lambda_R: 1.0
  lambda_rank: 0.2
  lambda_w: 0.5
  lambda_obs: 0.5
  lambda_mono: 0.1
stress_dataset:
  report_separately_from_natural_womd: true
  supported_types: [lead_brake, cut_in, occluded_release, contact_proxy, friction_delay]
